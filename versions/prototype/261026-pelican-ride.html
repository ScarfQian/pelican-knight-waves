<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1e8">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --ink: #29484b; --muted: #778b83; --paper: #edf1e8; --accent: #df765c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #df765c; outline-offset: 5px; }
    .page { width: min(1180px, calc(100% - 72px)); margin: 0 auto; padding: 34px 0 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .wordmark { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: 2.6px; }
    .wordmark svg { width: 34px; height: 34px; }
    .edition { font-size: 10px; letter-spacing: 2px; color: var(--muted); }
    .scene { position: relative; overflow: hidden; border-radius: 24px; background: #fcf6e9; box-shadow: 0 22px 50px -30px #355e5545, 0 0 0 1px #29484b0c; }
    .scene-copy { position: absolute; top: 6.1%; left: 5.4%; z-index: 1; pointer-events: none; }
    .eyebrow { margin: 0 0 12px; font-size: 10px; letter-spacing: 3px; color: #7d9587; }
    h1 { margin: 0; font-family: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif; font-size: clamp(24px, 3.1vw, 42px); font-weight: 500; letter-spacing: 3px; }
    .subtitle { margin: 12px 0 0; font-size: 12px; color: #7a9086; letter-spacing: 1px; }
    #landscape { display: block; width: 100%; height: auto; }
    .corner-mark { position: absolute; right: 3.8%; bottom: 4.2%; color: #8f826a; font-size: 9px; letter-spacing: 2px; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 2px 0; }
    .playback { display: flex; align-items: center; gap: 15px; }
    #toggle { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 50%; border: 0; color: #fff9eb; background: var(--ink); transition: background .2s, transform .2s; }
    #toggle:hover { background: #3b6264; transform: translateY(-2px); }
    #toggle svg { width: 18px; height: 18px; fill: currentColor; }
    #play-icon { display: none; }
    .paused #pause-icon { display: none; }
    .paused #play-icon { display: block; }
    .caption { display: flex; flex-direction: column; gap: 5px; }
    .caption strong { font-size: 12px; font-weight: 500; letter-spacing: 1px; }
    .caption span { font-size: 10px; color: var(--muted); letter-spacing: .6px; }
    .pace { display: flex; align-items: center; gap: 17px; }
    .pace-label { color: var(--muted); font-size: 10px; letter-spacing: 1px; }
    .speed-options { display: flex; padding: 4px; gap: 3px; border: 1px solid #cfdad0; border-radius: 100px; }
    .speed { min-width: 64px; padding: 8px 13px; border: 0; border-radius: 100px; background: transparent; color: #6f847a; font-size: 11px; transition: color .2s, background .2s; }
    .speed[aria-pressed="true"] { background: #fffaf0; color: var(--ink); box-shadow: 0 2px 6px #29484b09; }
    .speed:hover { color: #bd6551; }
    .bottom { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 17px; border-top: 1px solid #d7dfd4; color: #94a396; font-size: 9px; letter-spacing: 1.4px; }
    @media (min-width: 1500px) { .page { padding-top: 5vh; } }
    @media (max-width: 650px) {
      .page { width: calc(100% - 28px); padding: 24px 0 20px; }
      .masthead { margin-bottom: 18px; }
      .wordmark { font-size: 9px; letter-spacing: 1.8px; gap: 6px; }
      .wordmark svg { width: 27px; height: 27px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .scene { border-radius: 18px; }
      .scene-copy { top: 7%; }
      h1 { font-size: 22px; letter-spacing: 1px; }
      .eyebrow { font-size: 7px; margin-bottom: 7px; letter-spacing: 1.6px; }
      .subtitle { margin-top: 7px; font-size: 9px; letter-spacing: 0; }
      #landscape { width: 145%; max-width: none; margin-left: -22.5%; padding-top: 35px; }
      .corner-mark { font-size: 7px; }
      .controls { gap: 12px; padding-top: 18px; align-items: center; }
      .playback { gap: 10px; }
      #toggle { width: 39px; height: 39px; flex-shrink: 0; }
      .caption strong { font-size: 11px; }
      .caption span { font-size: 8px; }
      .pace-label { display: none; }
      .speed { min-width: 41px; padding: 8px 9px; font-size: 10px; }
      .bottom { margin-top: 21px; font-size: 8px; letter-spacing: .8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">

          <g id="flowers"><use href="#daisy" transform="translate(770 391) rotate(-12)"/><use href="#daisy" transform="translate(793 400) rotate(16) scale(.83)"/></g>

    <div class="controls">

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries(['rear-spokes', 'front-spokes', 'crank', 'rider', 'front-leg', 'front-leg-highlight', 'back-leg', 'front-foot', 'back-foot', 'scarf', 'eye', 'flowers', 'sea-shimmer', 'road-marks', 'ground-details', 'cloud-a', 'cloud-b', 'cloud-c', 'sailboat', 'distant-birds', 'breeze', 'bike-shadow', 'dust-a', 'dust-b'].map(id => [id, byId(id)]));
      const toggle = byId('toggle');
      const status = byId('ride-status');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let lastTime = null;
      const tau = Math.PI * 2;
      const setTransform = (id, value) => parts[id].setAttribute('transform', value);
      const loop = (value, size) => ((value % size) + size) % size;

      // 用两段肢体的几何关系，让脚掌始终贴合转动的踏板。
      function leg(hipX, hipY, footX, footY, upper, lower) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const length = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + length * length) / (2 * length);
        const across = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / length + across * dy / length;
        const kneeY = hipY + along * dy / length - across * dx / length;
        return `M${hipX.toFixed(2)} ${hipY.toFixed(2)} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${footX.toFixed(2)} ${(footY - 5).toFixed(2)}`;
      }

      function draw(time) {
        const angle = time * tau * 0.78;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 2.4;
        const sway = Math.cos(angle) * 1.2;
        const frontX = 575 + Math.cos(angle) * 29;
        const frontY = 535 + Math.sin(angle) * 29;
        const backX = 575 - Math.cos(angle) * 29;
        const backY = 535 - Math.sin(angle) * 29;
        setTransform('rear-spokes', `rotate(${degrees * 1.36})`);
        setTransform('front-spokes', `rotate(${degrees * 1.36})`);
        setTransform('crank', `rotate(${degrees} 575 535)`);
        setTransform('rider', `translate(${sway} ${bob})`);
        parts['back-leg'].setAttribute('d', leg(553 + sway, 418 + bob, backX, backY, 80, 79));
        const frontLeg = leg(564 + sway, 422 + bob, frontX, frontY, 79, 79);
        parts['front-leg'].setAttribute('d', frontLeg);
        parts['front-leg-highlight'].setAttribute('d', frontLeg);
        setTransform('front-foot', `translate(${frontX} ${frontY})`);
        setTransform('back-foot', `translate(${backX} ${backY})`);

        const flutter = Math.sin(angle * 1.8) * 6;
        const tip = Math.sin(angle * 1.8 + 1.1) * 8;
        parts.scarf.setAttribute('d', `M629 308 C600 ${290 + flutter} 577 ${317 - flutter} 550 ${298 + tip} L552 ${316 + tip} C582 ${337 - flutter} 602 ${310 + flutter} 630 320Z`);
        const blinkPhase = loop(time, 5.4);
        const blink = blinkPhase > 5.15 ? Math.max(.07, Math.abs((blinkPhase - 5.275) / .125)) : 1;
        setTransform('eye', `translate(675 242) scale(1 ${blink})`);
        setTransform('flowers', `rotate(${Math.sin(angle * 1.1) * 3} 776 422)`);

        // 前景、海面和云层采用不同速度，形成轻柔的视差。
        const roadDistance = time * tau * 0.78 * 1.36 * 88;
        setTransform('road-marks', `translate(${-loop(roadDistance, 210)} 0)`);
        setTransform('sea-shimmer', `translate(${-loop(time * 18, 260)} 0)`);
        setTransform('ground-details', `translate(${600 - loop(roadDistance * .82 + 600, 1800)} 0)`);
        setTransform('cloud-a', `translate(${110 - loop(time * 7 + 110, 1500)} 0)`);
        setTransform('cloud-b', `translate(${300 - loop(time * 10 + 300, 1500)} 0)`);
        setTransform('cloud-c', `translate(${550 - loop(time * 5 + 550, 1500)} 0)`);
        setTransform('sailboat', `translate(${202 + Math.sin(time * .12) * 24} ${409 + Math.sin(time * 1.3) * 1.5}) rotate(${Math.sin(time * .9) * 1.4})`);
        setTransform('distant-birds', `translate(${-Math.sin(time * .2) * 28} ${Math.sin(time * .7) * 3})`);
        setTransform('breeze', `translate(${-Math.sin(time * 4) * 8} 0)`);
        parts.breeze.setAttribute('opacity', .5 + Math.sin(time * 3.5) * .2);
        parts['bike-shadow'].setAttribute('rx', 242 + bob * 1.2);
        for (const [id, offset] of [['dust-a', 0], ['dust-b', .5]]) {
          const life = loop(time * 1.2 + offset, 1);
          const node = parts[id];
          node.setAttribute('cx', 337 - life * 73);
          node.setAttribute('cy', 626 - life * 8);
          node.setAttribute('rx', 4 + life * 12);
          node.setAttribute('opacity', (1 - life) * .6);
        }
      }

      function updateControls() {
        toggle.classList.toggle('paused', paused);
        toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
        toggle.setAttribute('aria-pressed', String(paused));
        status.textContent = paused ? '歇一下，看会儿海。' : speed < .8 ? '慢慢骑，慢慢看。' : speed > 1.2 ? '出发，去追一阵风。' : '正好，风也顺路。';
      }
      toggle.addEventListener('click', () => { paused = !paused; updateControls(); });
      document.querySelectorAll('.speed').forEach(button => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          document.querySelectorAll('.speed').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
          updateControls();
        });
      });
      window.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.target.closest('button, input, textarea, select, [contenteditable]')) return;
        event.preventDefault();
        paused = !paused;
        updateControls();
      });
      document.addEventListener('visibilitychange', () => { lastTime = null; });
      function frame(now) {
        if (lastTime !== null && !paused && !document.hidden) elapsed += Math.min((now - lastTime) / 1000, .05) * speed;
        lastTime = now;
        if (!paused && !document.hidden) draw(elapsed);
        requestAnimationFrame(frame);
      }
      draw(0);
      updateControls();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
